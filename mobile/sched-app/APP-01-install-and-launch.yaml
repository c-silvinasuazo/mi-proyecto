# APP-01: the app opens on a fresh install to the list of events, with a search box, and no login wall.
appId: ${MAESTRO_APP_ID}
---
- runFlow: common/launch.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Search"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: {id: "Event discovery search bar"}
- assertVisible: "Upcoming Events"
- assertNotVisible: "Sign In"
