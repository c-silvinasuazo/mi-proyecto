# APP-07: the event's search finds a session ($MAESTRO_OTHER_SESSION) by one word of its name and hides the others.
appId: ${MAESTRO_APP_ID}
---
- runFlow: common/open-event.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: {id: "ScheduleSearchBar"}
      - inputText: ${MAESTRO_OTHER_SESSION_WORD}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Search for a session"
      - inputText: ${MAESTRO_OTHER_SESSION_WORD}
      - hideKeyboard
- assertVisible: ${MAESTRO_OTHER_SESSION}
- assertNotVisible: ${MAESTRO_SESSION}
