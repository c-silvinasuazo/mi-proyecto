# APP-09: a session opens to its details: title, time and speaker, and its description when it has one
# ($MAESTRO_SESSION_DESCRIPTION; that check is skipped while it is unset).
appId: ${MAESTRO_APP_ID}
---
- runFlow: common/open-event.yaml
- runFlow: common/open-session.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: ".*begins ${MAESTRO_SESSION_DAY}, ${MAESTRO_SESSION_DATE} at ${MAESTRO_SESSION_START}.*"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "${MAESTRO_SESSION_START}.*"
- assertVisible: ${MAESTRO_SPEAKER}
- runFlow:
    when:
      true: ${MAESTRO_SESSION_DESCRIPTION}
    commands:
      # iOS reports the description with more text around it than the page shows, so match it inside a longer text.
      - assertVisible: ".*${MAESTRO_SESSION_DESCRIPTION}.*"
