# APP-10: the event's attendee list isn't blank (ENG-2213 was a blank list). iOS has it at Directory -> Attendees; the
# Android app (1.63.1) has no Directory tab and puts it at Info -> Attendees (ENG-2591 is about aligning the tabs).
appId: ${MAESTRO_APP_ID}
---
- runFlow: common/open-event.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Directory"
      - tapOn: "Attendees"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Info"
      - tapOn: "Attendees"
      # The list opens with its search box focused; the names show in the accessibility tree once the keyboard is down.
      - hideKeyboard
- assertVisible: ${MAESTRO_ATTENDEE}
